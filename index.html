<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>
:root{--green:#004d4e;--teal:#2ec4a6;--bg:#f3f7f6;--card:#fff;--text:#2b2b2d;--muted:#5f6f6e;--line:#c5d4d2;--tint:#e3f1ef;--on-green:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--green:#0b6b6c;--bg:#0f1b1b;--card:#162626;--text:#e8f0ef;--muted:#9bb0ae;--line:#2c4343;--tint:#1d3434}}
:root[data-theme="dark"]{--green:#0b6b6c;--bg:#0f1b1b;--card:#162626;--text:#e8f0ef;--muted:#9bb0ae;--line:#2c4343;--tint:#1d3434}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Sora',Arial,sans-serif;font-size:15px;line-height:1.45}
header{background:var(--green);color:var(--on-green);padding:22px 18px 18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header img{height:34px;width:auto;flex:none}
header h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
header p{margin:4px 0 0;font-size:12px;opacity:.85}
main{max-width:720px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.row,.row3{grid-template-columns:1fr}}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.thumb{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.thumb img{display:block;width:100%;height:120px;object-fit:cover}
.thumb button{position:absolute;top:6px;right:6px;flex:none;padding:4px 10px;font-size:13px;background:var(--card);color:var(--text);border-color:var(--line)}
.thumb input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:14px;padding:8px 10px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
label{display:block;font-size:12px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
:root[data-theme="dark"] label{color:var(--teal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) label{color:var(--teal)}}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.field{margin-bottom:12px}.field:last-child{margin-bottom:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
button,a.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:12px 16px;border:1px solid var(--green);cursor:pointer;text-decoration:none;text-align:center;flex:1 1 150px}
.primary{background:var(--green);color:var(--on-green)}
.wa{background:#25d366;border-color:#25d366;color:#08331a}
.ghost{background:transparent;color:var(--text);border-color:var(--line)}
#msg{min-height:20px;margin-top:10px;font-size:13px;color:var(--muted)}
footer{text-align:center;font-size:11px;color:var(--muted);padding-bottom:10px}
.ens{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg)}
.ens input,.ens select{background:var(--card)}
.ens-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ens-top strong{font-size:13px;color:var(--text)}
.ens-top button{flex:none;padding:6px 12px;font-size:13px;background:transparent;color:var(--text);border-color:var(--line)}
.cp{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.cp strong{display:block;font-size:13px;margin-bottom:10px}
.add{width:100%;background:transparent;color:var(--green);border:1px dashed var(--green)}
:root[data-theme="dark"] .add{color:var(--teal);border-color:var(--teal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .add{color:var(--teal);border-color:var(--teal)}}
@media print{header{background:none;color:#000}.actions,#msg{display:none}}
</style>
</head>
<body>
<header>
  <div><h1>RELATÓRIO DE TURNO</h1>
  <p>Preencha os campos e gere o PDF para enviar no grupo</p></div>
  <img id="logo" alt="MCA">
</header>
<main>
  <div class="card">
    <div class="field"><label for="resp">Responsável</label><input id="resp" autocomplete="name" placeholder="Nome completo"></div>
    <div class="row">
      <div class="field"><label for="data">Data</label><input id="data" type="date"></div>
      <div class="field"><label for="turno">Turno</label><select id="turno"><option value="">Selecione</option><option>A</option><option>B</option><option>C</option></select></div>
    </div>
    <div class="field"><label for="inicio">Início e fim das atividades</label><input id="inicio" placeholder="Ex.: 07:00 às 19:00"></div>
    <div class="field"><label for="local">Local</label><input id="local" placeholder="Frente de serviço / área"></div>
    <div class="row">
      <div class="field"><label for="tempo">Tempo</label><select id="tempo"><option value="">Selecione</option><option>Seco</option><option>Nublado</option><option>Chuva fraca</option><option>Chuva forte</option></select></div>
      <div class="field"><label for="vias">Condição das vias</label><select id="vias"><option value="">Selecione</option><option>Boas</option><option>Regulares</option><option>Críticas</option></select></div>
    </div>
  </div>
  <div class="card">
    <div class="field"><label for="desc">Descrição das atividades</label><textarea id="desc" placeholder="O que foi executado no turno"></textarea></div>
    <div class="field"><label for="equip">Equipamentos</label><textarea id="equip" placeholder="Equipamentos utilizados e situação (operando, parado, em manutenção)"></textarea></div>
  </div>
  <div class="card">
    <div class="field"><label for="aten">Pontos de atenção para o próximo turno</label><textarea id="aten" placeholder="Pendências, riscos, condições das vias, o que precisa de continuidade"></textarea></div>
    <div class="field"><label for="ocor">Ocorrências / Relevantes</label><textarea id="ocor" placeholder="Acidentes, quase acidentes, paralisações, fatos importantes"></textarea></div>
  </div>
  <div class="card">
    <label>Ensaios laboratoriais</label>
    <div id="enslist"></div>
    <button class="add" id="addens" type="button">+ Adicionar ensaio</button>
    <p class="hint">Opcional. Se nenhum ensaio for preenchido, a tabela não aparece no PDF.</p>
    <datalist id="tipos"><option value="Cilindro de Cravação"><option value="Frasco de areia"><option value="Speedy (umidade)"><option value="Hilf"><option value="Granulometria"></datalist>
  </div>
  <div class="card">
    <label for="fotoin">Fotos (até 4)</label>
    <input id="fotoin" type="file" accept="image/*" multiple>
    <div class="thumbs" id="thumbs"></div>
    <p class="hint">As fotos entram no PDF. Elas não ficam salvas na página: se fechar antes de gerar, adicione de novo.</p>
  </div>
  <div class="actions">
    <button class="primary" id="pdf" type="button">Gerar PDF</button>
    <a class="btn wa" id="wpp" href="#" target="_blank" rel="noopener">Enviar texto no WhatsApp</a>
    <button class="ghost" id="copiar" type="button">Copiar relatório</button>
    <button class="ghost" id="limpar" type="button">Limpar</button>
  </div>
  <div id="msg" role="status"></div>
</main>
<footer>© MCA 2026</footer>

let fotos=[];
let ensaios=[];
document.getElementById('logo').src=LOGO;
const $=i=>document.getElementById(i);
const KEY='mca_relatorio_turno';
const KEYE='mca_relatorio_ensaios';
function save(){try{localStorage.setItem(KEY,JSON.stringify(Object.fromEntries(ids.map(i=>[i,$(i).value]))))}catch(e){}}
function saveE(){try{localStorage.setItem(KEYE,JSON.stringify(ensaios))}catch(e){}}
function load(){let d={};try{d=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  ids.forEach(i=>{if(d[i])$(i).value=d[i]});
  if(!$('data').value){const t=new Date();$('data').value=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
  try{const e=JSON.parse(localStorage.getItem(KEYE)||'[]');if(Array.isArray(e))ensaios=e}catch(e){}
  desenharE()}
function fmtData(v){if(!v)return '';const [y,m,d]=v.split('-');return d+'/'+m+'/'+y}
function pct(v){v=(v||'').trim();if(!v)return '';return /%$/.test(v)?v.replace(/\s*%$/,' %'):v+' %'}
const KS=['lab','tipo','local','gc','um','res'];
function novoCP(){return {lab:'Chammas',tipo:'',local:'',gc:'',um:'',res:''}}
function temDados(o,semLab){return !!o&&KS.filter(k=>!(semLab&&k==='lab')).some(k=>(o[k]||'').trim())}
function linhasEns(){const r=[];ensaios.forEach(e=>{if(temDados(e))r.push({...e,cp:false});if(temDados(e.cp,true))r.push({...e.cp,cp:true})});return r}
function ensCheios(){return linhasEns()}
function texto(){
  const v=i=>$(i).value.trim()||'-';
  const L=['*RELATÓRIO DE TURNO – MCA*','',
  '*Responsável:* '+v('resp'),'*Data:* '+(fmtData($('data').value)||'-'),'*Turno:* '+v('turno'),'*Início e fim das atividades:* '+v('inicio'),'*Local:* '+v('local'),'*Tempo:* '+v('tempo'),'*Condição das vias:* '+v('vias'),'',
  '*Descrição das atividades:*',v('desc'),'','*Equipamentos:*',v('equip'),'',
  '*Pontos de atenção para o próximo turno:*',v('aten'),'','*Ocorrências / Relevantes:*',v('ocor')];
  const en=ensCheios();
  if(en.length){L.push('','*Ensaios laboratoriais:*');
    en.forEach((e,k)=>L.push((k+1)+'. '+[(e.lab||'-')+(e.cp?' (contraprova)':''),e.tipo||'-','Local: '+(e.local||'-'),'GC: '+(pct(e.gc)||'-'),'Umidade: '+(pct(e.um)||'-'),(e.res||'-')].join(' | ')))}
  return L.join('\n')}
function aviso(t){$('msg').textContent=t;setTimeout(()=>{$('msg').textContent=''},4000)}
async function copiar(){
  const t=texto();
  try{await navigator.clipboard.writeText(t);aviso('Relatório copiado. É só colar onde precisar.')}
  catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand('copy');aviso('Relatório copiado. É só colar onde precisar.')}catch(x){aviso('Não foi possível copiar automaticamente.')}
    a.remove()}}
ids.forEach(i=>$(i).addEventListener('input',save));
$('copiar').addEventListener('click',copiar);
$('wpp').addEventListener('click',()=>{$('wpp').href='https://wa.me/?text='+encodeURIComponent(texto())});
$('limpar').addEventListener('click',()=>{if(confirm('Limpar todos os campos?')){ids.forEach(i=>$(i).value='');fotos=[];ensaios=[];desenhar();try{localStorage.removeItem(KEY);localStorage.removeItem(KEYE)}catch(e){}load()}});

function campoE(e,k,rot,ph,tipo){
  const f=document.createElement('div');f.className='field';
  const l=document.createElement('label');l.textContent=rot;
  let el;
  if(tipo==='res'){el=document.createElement('select');['','Aprovado','Reprovado'].forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o||'Selecione';el.appendChild(op)})}
  else{el=document.createElement('input');el.placeholder=ph;if(tipo==='num')el.inputMode='decimal';if(k==='tipo')el.setAttribute('list','tipos')}
  el.value=e[k]||'';
  el.addEventListener('input',()=>{e[k]=el.value;saveE()});el.addEventListener('change',()=>{e[k]=el.value;saveE()});
  l.appendChild(document.createTextNode(''));f.append(l,el);return f}
function desenharE(){
  const box=$('enslist');box.textContent='';
  ensaios.forEach((e,k)=>{
    const d=document.createElement('div');d.className='ens';
    const top=document.createElement('div');top.className='ens-top';
    const s=document.createElement('strong');s.textContent='Ensaio '+(k+1);
    const b=document.createElement('button');b.type='button';b.textContent='Remover';
    b.addEventListener('click',()=>{ensaios.splice(k,1);saveE();desenharE()});
    top.append(s,b);
    const r1=document.createElement('div');r1.className='row';
    r1.append(campoE(e,'lab','Laboratório','Ex.: Fagundes'),campoE(e,'tipo','Tipo de ensaio','Ex.: Frasco de areia'));
    const r2=document.createElement('div');r2.className='row3';
    r2.append(campoE(e,'local','Local','Estaca / camada'),campoE(e,'gc','GC (%)','Ex.: 98,2','num'),campoE(e,'um','Umidade (%)','Ex.: 11,8','num'));
    if(!e.cp)e.cp=novoCP();
    const cp=document.createElement('div');cp.className='cp';
    const st=document.createElement('strong');st.textContent='Contraprova';
    const c1=document.createElement('div');c1.className='row';
    c1.append(campoE(e.cp,'lab','Laboratório','Ex.: Chammas'),campoE(e.cp,'tipo','Tipo de ensaio','Ex.: Frasco de areia'));
    const c2=document.createElement('div');c2.className='row3';
    c2.append(campoE(e.cp,'local','Local','Estaca / camada'),campoE(e.cp,'gc','GC (%)','Ex.: 97,6','num'),campoE(e.cp,'um','Umidade (%)','Ex.: 12,4','num'));
    cp.append(st,c1,c2,campoE(e.cp,'res','Resultado','','res'));
    d.append(top,r1,r2,campoE(e,'res','Resultado','','res'),cp);
    box.appendChild(d)})}
$('addens').addEventListener('click',()=>{ensaios.push({lab:'',tipo:'',local:'',gc:'',um:'',res:'',cp:novoCP()});saveE();desenharE()});

function semAcento(t){return t.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')}
function montarPDF(){
  const J=window.jspdf.jsPDF, doc=new J({unit:'mm',format:'a4'});
  const LW=3.364;const W=210,H=297,M=16,CW=W-2*M,LH=5.2,FT=16,G=4;
  const green=[0,77,78],tint=[227,241,239],line=[183,199,198],txt=[43,43,45];
  const RED=[179,38,30],REDT=[251,233,231],AMB=[154,103,0],AMBT=[255,244,214],OK=[30,123,58],OKT=[228,244,232];
  let y=0;
  function topo(first){
    doc.setFillColor(...green);doc.rect(0,0,W,first?26:14,'F');
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(first?16:11);
    doc.text(first?'RELATÓRIO DE TURNO':'RELATÓRIO DE TURNO (continuação)',M,first?16:9);
    if(first){if(LOGO){try{doc.addImage(LOGO,'PNG',W-M-12*LW,7,12*LW,12)}catch(e){}}else{doc.setFontSize(13);doc.text('MCA',W-M,16,{align:'right'})}}
    y=first?34:22;
  }
  function nova(){doc.addPage();topo(false)}
  const tTempo={'Seco':[OK,OKT],'Nublado':[OK,OKT],'Chuva fraca':[AMB,AMBT],'Chuva forte':[RED,REDT]};
  const tVias={'Boas':[OK,OKT],'Regulares':[AMB,AMBT],'Críticas':[RED,REDT]};
  function cel(x,w,label,val,tone){
    doc.setFillColor(...tint);doc.setDrawColor(...line);doc.setLineWidth(.2);doc.rect(x,y,w,13,'FD');
    doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(...green);doc.text(label.toUpperCase(),x+3,y+4.2);
    let t=(val||'').trim()||'-';
    if(tone&&t!=='-'){doc.setFontSize(9);const tw=doc.getTextWidth(t)+8;
      doc.setFillColor(...tone[1]);doc.setDrawColor(...tone[0]);doc.roundedRect(x+3,y+6,tw,5.6,2.8,2.8,'FD');
      doc.setTextColor(...tone[0]);doc.text(t,x+7,y+9.9)}
    else{doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(...txt);
      const l=doc.splitTextToSize(t,w-6);if(l.length>1)t=l[0].replace(/\s+$/,'')+'...';doc.text(t,x+3,y+9.6)}
  }
  function secao(titulo,val,est){
    const E={normal:[[255,255,255],line,txt],atencao:[AMBT,AMB,txt],ok:[OKT,OK,OK],alerta:[REDT,RED,txt]}[est||'normal'];
    const fonte=est==='ok'?'bold':'normal';
    doc.setFont('helvetica',fonte);doc.setFontSize(10.5);
    const ln=doc.splitTextToSize((val||'').trim()||'-',CW-8);
    if(y+7+LH+6>H-FT)nova();
    doc.setFillColor(...green);doc.rect(M,y,CW,7,'F');
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(titulo.toUpperCase(),M+3,y+4.7);
    y+=7;
    let i=0;
    while(i<ln.length){
      const disp=Math.floor((H-FT-y-6)/LH);
      if(disp<1){nova();continue}
      const parte=ln.slice(i,i+disp),ult=i+disp>=ln.length,h=Math.max(parte.length*LH+5,ult?12:0);
      doc.setFillColor(...E[0]);doc.setDrawColor(...E[1]);doc.setLineWidth(.2);doc.rect(M,y,CW,h,'FD');
      doc.setFont('helvetica',fonte);doc.setFontSize(10.5);doc.setTextColor(...E[2]);doc.text(parte,M+4,y+5.6);
      y+=h;i+=disp;
    }
    y+=6;
  }
  function tabelaEnsaios(lista){
    const cols=[['Laboratório',.16],['Tipo de ensaio',.22],['Local',.15],['GC (Grau de Compactação)',.19],['Umidade',.13],['Resultado',.15]];
    const ws=cols.map(c=>c[1]*CW);
    function cab(){
      doc.setFillColor(...green);doc.rect(M,y,CW,7,'F');
      doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('ENSAIOS LABORATORIAIS',M+3,y+4.7);
      y+=7;
      doc.setFont('helvetica','bold');doc.setFontSize(8);
      const hl=cols.map((c,j)=>doc.splitTextToSize(c[0],ws[j]-4));
      const hh=Math.max(...hl.map(l=>l.length))*3.6+4;
      let x=M;
      cols.forEach((c,j)=>{doc.setFillColor(...tint);doc.setDrawColor(...line);doc.setLineWidth(.2);doc.rect(x,y,ws[j],hh,'FD');
        doc.setTextColor(...green);doc.text(hl[j],x+2,y+4.4);x+=ws[j]});
      y+=hh;
    }
    if(y+7+12+10>H-FT)nova();
    cab();
    lista.forEach(e=>{
      const vals=[(e.lab||'')+(e.cp&&(e.lab||'').trim()?' (contraprova)':(e.cp?'Contraprova':'')),e.tipo,e.local,pct(e.gc),pct(e.um),e.res].map(s=>(s||'').trim()||'—');
      doc.setFontSize(9);
      const ls=vals.map((s,j)=>{doc.setFont('helvetica',j===5?'bold':'normal');return doc.splitTextToSize(s,ws[j]-4)});
      const rh=Math.max(...ls.map(l=>l.length))*4.2+4;
      if(y+rh>H-FT){nova();cab()}
      let x=M;
      vals.forEach((s,j)=>{
        doc.setFillColor(...(e.cp?[246,250,249]:[255,255,255]));doc.setDrawColor(...line);doc.setLineWidth(.2);doc.rect(x,y,ws[j],rh,'FD');
        let cor=txt;
        if(j===5){doc.setFont('helvetica','bold');if(/^aprov/i.test(s))cor=OK;else if(/^reprov/i.test(s))cor=RED}else doc.setFont('helvetica','normal');
        doc.setTextColor(...cor);doc.text(ls[j],x+2,y+5);x+=ws[j]});
      y+=rh;
    });
    y+=6;
  }
  const v=i=>$(i).value;
  topo(true);
  const wR=CW*0.46,wT=CW*0.18,wD=CW-2*G-wR-wT,w2=(CW-G)/2;
  cel(M,wR,'Responsável',v('resp'));cel(M+wR+G,wD,'Data',fmtData(v('data')));cel(M+wR+wD+2*G,wT,'Turno',v('turno'));y+=13+G;
  cel(M,w2,'Local',v('local'));cel(M+w2+G,w2,'Início e fim das atividades',v('inicio'));y+=13+G;
  cel(M,w2,'Tempo',v('tempo'),tTempo[v('tempo')]);cel(M+w2+G,w2,'Condição das vias',v('vias'),tVias[v('vias')]);y+=13+7;
  secao('Descrição das atividades',v('desc'));
  secao('Equipamentos',v('equip'));
  secao('Pontos de atenção para o próximo turno',v('aten'),v('aten').trim()?'atencao':'normal');
  const en=ensCheios();
  if(en.length)tabelaEnsaios(en);
  const oc=v('ocor').trim(), sem=/^\s*(n[aã]o houve|sem ocorr|nenhuma|-)/i.test(oc);
  secao('Ocorrências / Relevantes',oc,!oc?'normal':(sem?'ok':'alerta'));
  if(fotos.length){
    const bh=50,cw=(CW-G)/2;
    if(y+10+bh+10>H-FT)nova();
    doc.setFillColor(...green);doc.rect(M,y,CW,7,'F');
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('REGISTRO FOTOGRÁFICO',M+3,y+4.7);
    y+=10;
    for(let k=0;k<fotos.length;k+=2){
      const par=fotos.slice(k,k+2);
      doc.setFont('helvetica','normal');doc.setFontSize(8.5);
      const caps=par.map((f,j)=>doc.splitTextToSize('Foto '+(k+j+1)+(f.leg&&f.leg.trim()?': '+f.leg.trim():''),cw));
      const rh=bh+Math.max(...caps.map(c=>c.length))*4+6;
      if(y+rh>H-FT)nova();
      par.forEach((f,j)=>{
        const x=M+j*(cw+G);
        doc.setFillColor(238,242,242);doc.setDrawColor(...line);doc.rect(x,y,cw,bh,'FD');
        const r=Math.min((cw-2)/f.w,(bh-2)/f.h),iw=f.w*r,ih=f.h*r;
        doc.addImage(f.url,'JPEG',x+(cw-iw)/2,y+(bh-ih)/2,iw,ih);
        doc.setFillColor(...green);doc.circle(x+5,y+5,3,'F');
        doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text(String(k+j+1),x+5,y+6.1,{align:'center'});
        doc.setTextColor(...txt);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.text(caps[j],x,y+bh+4.2);
      });
      y+=rh;
    }
  }
  const n=doc.getNumberOfPages(),ag=new Date(),p2=x=>String(x).padStart(2,'0');
  const ger='Gerado em '+p2(ag.getDate())+'/'+p2(ag.getMonth()+1)+'/'+ag.getFullYear()+' às '+p2(ag.getHours())+':'+p2(ag.getMinutes());
  for(let p=1;p<=n;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(107,123,122);
    doc.text('© MCA 2026',M,H-8);doc.text(ger,W/2,H-8,{align:'center'});doc.text('Página '+p+' de '+n,W-M,H-8,{align:'right'})}
  return doc;
}
$('pdf').addEventListener('click',()=>{
  if(!window.jspdf){aviso('Não foi possível carregar o gerador de PDF. Verifique a conexão e recarregue.');return}
  if(!$('resp').value.trim()){aviso('Preencha o nome do responsável antes de gerar o PDF.');$('resp').focus();return}
  try{
    const doc=montarPDF();
    doc.save('Relatorio_Turno_'+($('data').value||'')+'_'+semAcento($('resp').value)+'.pdf');
    aviso('PDF gerado. Agora é só compartilhar no grupo.');
  }catch(x){aviso('Não foi possível gerar o PDF.')}
});
function desenhar(){
  const t=$('thumbs');t.textContent='';
  fotos.forEach((f,k)=>{
    const d=document.createElement('div');d.className='thumb';
    const im=document.createElement('img');im.src=f.url;im.alt='Foto '+(k+1);
    const b=document.createElement('button');b.type='button';b.textContent='Remover';
    b.addEventListener('click',()=>{fotos.splice(k,1);desenhar()});
    const ci=document.createElement('input');ci.placeholder='Legenda (opcional)';ci.maxLength=80;ci.value=f.leg||'';ci.addEventListener('input',()=>{f.leg=ci.value});
    d.append(im,ci,b);t.appendChild(d)});
}
function lerFoto(file){return new Promise((ok,err)=>{
  const fr=new FileReader();
  fr.onerror=()=>err();
  fr.onload=()=>{const im=new Image();im.onerror=()=>err();
    im.onload=()=>{const m=1200,r=Math.min(1,m/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      ok({url:c.toDataURL('image/jpeg',0.75),w:c.width,h:c.height,leg:''})};
    im.src=fr.result};
  fr.readAsDataURL(file)})}
$('fotoin').addEventListener('change',async e=>{
  const arq=[...e.target.files];e.target.value='';
  const vagas=4-fotos.length;
  if(arq.length>vagas)aviso('Máximo de 4 fotos. Foram adicionadas só as primeiras.');
  for(const f of arq.slice(0,Math.max(vagas,0))){try{fotos.push(await lerFoto(f))}catch(x){aviso('Não foi possível ler uma das fotos.')}}
  desenhar();
});
load();
</script>
